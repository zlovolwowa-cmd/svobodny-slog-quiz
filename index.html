<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Свободный Слог: Квиз</title>
  <!-- Подключение VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    :root {
      --vk-bg: #edeef0;
      --vk-card: #ffffff;
      --vk-primary: #2d81e0;
      --vk-primary-hover: #266dc2;
      --vk-text: #000000;
      --vk-subtext: #818c99;
      --vk-correct: #4bb34b;
      --vk-wrong: #e64646;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif; 
    }
    body { 
      background-color: var(--vk-bg); 
      color: var(--vk-text); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px; 
    }
    .card { 
      background: var(--vk-card); 
      width: 100%; 
      max-width: 420px; 
      border-radius: 16px; 
      padding: 24px; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.08); 
      text-align: center; 
    }
    h1 { 
      font-size: 20px; 
      margin-bottom: 8px; 
    }
    .subtitle { 
      color: var(--vk-subtext); 
      font-size: 14px; 
      margin-bottom: 20px; 
    }
    .quote-box { 
      background: #f5f6f8; 
      border-left: 4px solid var(--vk-primary); 
      padding: 16px; 
      border-radius: 8px; 
      font-style: italic; 
      font-size: 16px; 
      line-height: 1.5; 
      margin-bottom: 20px; 
      min-height: 90px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .options-grid { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      margin-bottom: 20px; 
    }
    .btn { 
      background: #f0f2f5; 
      border: 1px solid #e1e3e6; 
      padding: 14px; 
      border-radius: 10px; 
      font-size: 15px; 
      font-weight: 500; 
      cursor: pointer; 
      transition: 0.2s; 
      color: var(--vk-text); 
      width: 100%; 
    }
    .btn:active { 
      transform: scale(0.98); 
    }
    .btn.primary { 
      background: var(--vk-primary); 
      color: #fff; 
      border: none; 
    }
    .btn.correct { 
      background: var(--vk-correct); 
      color: #fff; 
      border-color: var(--vk-correct); 
    }
    .btn.wrong { 
      background: var(--vk-wrong); 
      color: #fff; 
      border-color: var(--vk-wrong); 
    }
    .progress { 
      font-size: 13px; 
      color: var(--vk-subtext); 
      margin-bottom: 12px; 
    }
    .hidden { 
      display: none; 
    }
  </style>
</head>
<body>

  <!-- Начальный экран -->
  <div class="card" id="start-screen">
    <h1>Свободный Слог: Квиз</h1>
    <p class="subtitle">Угадайте автора стихотворения по одной строке!</p>
    <div class="quote-box">В каждом раунде — новые случайные цитаты поэтов.</div>
    <button class="btn primary" onclick="startGame()">Начать игру</button>
  </div>

  <!-- Экран квиза -->
  <div class="card hidden" id="quiz-screen">
    <div class="progress" id="progress-text">Вопрос 1 из 5</div>
    <div class="quote-box" id="question-text">Загрузка...</div>
    <div class="options-grid" id="options-container"></div>
  </div>

  <!-- Экран результатов -->
  <div class="card hidden" id="result-screen">
    <h1>Результат раунда</h1>
    <p class="subtitle" id="result-title">Отличная работа!</p>
    <div class="quote-box" id="result-score" style="font-style: normal; font-weight: bold; font-size: 22px;">0 / 5</div>
    <button class="btn primary" style="margin-bottom: 10px;" onclick="startGame()">Новый раунд (другие вопросы)</button>
    <button class="btn" onclick="shareStory()">Поделиться в VK</button>
  </div>

  <script>
    // Инициализация моста VK

    const QUESTION_BANK = [

        correct: 0
      },

      },

      },

        correct: 0
      },
      {

        options: ["А. Фет", "Ф. Тютчев", "А. Майков", "И. Бунин"],
        correct: 1
      },
      {
        quote: "Я пришел к тебе с приветом, рассказать, что солнце встало...",
        options: ["А. Фет", "Ф. Тютчев", "А. Плещеев", "А. Пушкин"],
        correct: 0
      },
      {
        quote: "Крошка сын к отцу пришел, и спросила кроха: — Что такое хорошо и что такое плохо?",
        options: ["С. Маршак", "В. Маяковский", "К. Чуковский", "С. Михалков"],
        correct: 1
      },

      // Серебряный век и авангард
      {

        options: ["И. Северянин", "В. Маяковский", "В. Хлебников", "Д. Бурлюк"],

      },
      {

      {

      {

    const QUESTIONS_PER_GAME = 5;
    let gameQuestions = [];
    let currentQuestion = 0;
    let score = 0;

    // Алгоритм случайного перемешивания Фишера — Йетса
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      // Выбираем 5 случайных вопросов и случайно перемешиваем варианты ответов
      const shuffledQuestions = shuffle(QUESTION_BANK).slice(0, QUESTIONS_PER_GAME);
      
      gameQuestions = shuffledQuestions.map(q => {
        const correctAnswerText = q.options[q.correct];
        const shuffledOptions = shuffle(q.options);
        return {
          quote: q.quote,
          options: shuffledOptions,
          correct: shuffledOptions.indexOf(correctAnswerText)
        };
      });

      currentQuestion = 0;
      score = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = gameQuestions[currentQuestion];
      document.getElementById('progress-text').innerText = `Вопрос ${currentQuestion + 1} из ${QUESTIONS_PER_GAME}`;
      document.getElementById('question-text').innerText = `«${q.quote}»`;
      
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(btn, idx === q.correct);
        container.appendChild(btn);
      });
    }

    function selectAnswer(btn, isCorrect) {
      const allButtons = document.querySelectorAll('#options-container .btn');
      allButtons.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        allButtons[gameQuestions[currentQuestion].correct].classList.add('correct');
      }

      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < QUESTIONS_PER_GAME) {
          showQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('result-score').innerText = `${score} из ${QUESTIONS_PER_GAME}`;

      let title = "Знаток литературы!";
      if (score === QUESTIONS_PER_GAME) title = "Абсолютный триумф! Профессор поэзии 🎓";
      else if (score <= 2) title = "Есть куда расти! Пора перечитать классику 📖";
      
      document.getElementById('result-title').innerText = title;
    }
